name: Build and Deploy to GCP Compute Engine

on:
  push:
    branches:
      - main
    paths:
      - backend/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v3

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build and Push Docker Image to DockerHub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: eviltwin7648/eventapp-backend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCP Compute Engine
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo docker pull eviltwin7648/eventapp-backend:latest
            sudo docker stop eventapp-backend || true
            sudo docker rm eventapp-backend || true
            sudo docker run -e DATABASE_URL=${{ secrets.DATABASE_URL }} -d --name eventapp-backend -p 5000:5000 eviltwin7648/eventapp-backend:latest
